[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dianxun"
version = "0.2.0.dev0"
description = "ZhuGuang (Dianxun): stateful multi-agent incident closure for convenience-store operations"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "XZQ" },
]
dependencies = []

[project.optional-dependencies]
postgres = [
  "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
  "jsonschema>=4.25,<5",
  "pyyaml>=6.0.2,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
dianxun = "dianxun.cli:main"
dianxun-mcp = "dianxun.mcp.server:main"

[project.urls]
Repository = "https://github.com/XZQ/zhuguang"
Competition = "https://www.goaihz.com/tracks"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.data-files]
"share/dianxun/config" = ["config/project-facts.json"]
"share/dianxun/config/policies" = ["config/policies/coldchain-demo.v1.json"]
"share/dianxun/demo/state" = ["demo/state/seed.json"]
"share/dianxun/demo/state/scenarios" = ["demo/state/scenarios/*.json"]
"share/dianxun/schemas" = ["schemas/*.json"]
"share/dianxun/skills" = ["skills/registry.json", "skills/LIFECYCLE.md"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dianxun.state" = ["sql/*.sql"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["ppt"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/dianxun/report.py" = ["E501"] # Embedded SVG, HTML, and CSS assets are intentionally unwrapped.
"src/dianxun/command_center.py" = ["E501"] # Embedded SVG, HTML, and CSS assets are intentionally unwrapped.

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
