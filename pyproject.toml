[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dianxun"
version = "0.2.0.dev0"
description = "Stateful multi-agent incident response demo for convenience-store operations"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "XZQ" },
]
dependencies = []

[project.scripts]
dianxun = "dianxun.cli:main"
dianxun-mcp = "dianxun.mcp.server:main"

[project.urls]
Repository = "https://github.com/XZQ/zhuguang"
Competition = "https://www.goaihz.com/tracks"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.data-files]
"share/dianxun/config" = ["config/project-facts.json"]
"share/dianxun/config/policies" = ["config/policies/coldchain-demo.v1.json"]
"share/dianxun/demo/state" = ["demo/state/seed.json"]
"share/dianxun/demo/state/scenarios" = ["demo/state/scenarios/*.json"]
"share/dianxun/schemas" = ["schemas/*.json"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["ppt"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
