apiVersion: apps/v1
kind: Deployment
metadata:
  name: dianxun-mcp
  namespace: dianxun
  labels:
    app.kubernetes.io/name: dianxun-mcp
    app.kubernetes.io/part-of: dianxun-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dianxun-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dianxun-mcp
        app.kubernetes.io/part-of: dianxun-agent
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: dianxun-mcp:0.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "8080"
            - name: DIANXUN_STATE_DB
              value: /var/lib/dianxun/runtime.db
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            - name: state
              mountPath: /var/lib/dianxun
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: dianxun-mcp-state
        - name: tmp
          emptyDir: {}
