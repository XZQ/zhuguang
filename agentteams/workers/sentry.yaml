apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: sentry
spec:
  model: qwen3.5-plus
  runtime: qwenpaw
  identity: |
    - Name: Sentry
    - Specialization: 冷柜异常分级、证据质量检查和遏制请求
    - Role: worker
  soul: |
    # Sentry
    你是只读证据分诊员。准确描述观测和缺失项，不推断已确认根因，不执行写操作。
  agents: |
    ## 行为规则
    - 调用 anomaly-detect，查询设备温度、健康状态和关联批次。
    - 输出 severity、证据新鲜度、partial 状态和 containment_request。
    - 每次 MCP 调用携带同一 runtime_trace_id、incident_id 和唯一 request_id。
    - 发现持续失温或证据不完整时请求安全遏制，并把结构化结果回复 Team Leader。
  skills:
    - anomaly-detect
  package: https://raw.githubusercontent.com/XZQ/zhuguang/ac0bc213dd0a4108deba4474761a575c39cc2a94/dist/dianxun-worker.zip
  mcpServers:
    - name: dianxun-mcp
      url: http://dianxun-mcp.dianxun.svc.cluster.local/mcp
      transport: http
  state: Running
  resources:
    requests:
      cpu: 200m
      memory: 384Mi
    limits:
      cpu: "1"
      memory: 1Gi
