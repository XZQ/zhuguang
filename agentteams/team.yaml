# AgentTeams v1.2.3 Team：一个 Team Leader + 四个领域 Worker。
apiVersion: agentteams.io/v1beta1
kind: Team
metadata:
  name: dianxun-patrol-team
spec:
  description: 冷柜失温事故五阶段闭环团队；负责证据、诊断、受控执行、独立验证和复盘。
  heartbeatEvery: 30m
  peerMentions: true
  workerMembers:
    - name: orchestrator
      role: team_leader
    - name: sentry
      role: worker
    - name: diagnoser
      role: worker
    - name: executor
      role: worker
    - name: auditor
      role: worker
