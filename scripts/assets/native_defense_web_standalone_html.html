<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VeriAgent 决赛准备 · 逐光队</title>
  <style>
    :root {
      --bg: #070b14;
      --card: #0f172a;
      --border: rgba(56, 189, 248, 0.2);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --text: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --cyan: #38bdf8;
      --green: #10b981;
      --red: #ef4444;
      --font-mono: "Fira Code", monospace;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
      margin: 0;
      padding: 24px 16px;
      line-height: 1.6;
    }
    .demo-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .demo-btn:hover {
      background: #1e293b;
      border-color: var(--cyan);
    }
    .tbl {
      width: 100%;
      border-collapse: collapse;
    }
    .tbl th, .tbl td {
      border: 1px solid var(--border-subtle);
    }
    a { color: var(--cyan); }
  </style>
</head>
<body>
@@value0@@
</body>
</html>
