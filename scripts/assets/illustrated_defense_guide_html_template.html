<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>2026 GOAI 复赛答辩图文全景手册 · 逐光队</title>
  <style>
    @page {
      size: A4;
      margin: 16mm 14mm 16mm 14mm;
      @bottom-right {
        content: counter(page);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 8pt;
        color: #64748b;
      }
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: #0f172a;
      line-height: 1.55;
      font-size: 9.5pt;
      margin: 0;
      padding: 20px;
      background: #ffffff;
    }
    h1 {
      font-size: 17pt;
      color: #0369a1;
      border-bottom: 2px solid #0284c7;
      padding-bottom: 8px;
      margin-top: 0;
      margin-bottom: 10px;
    }
    h2 {
      font-size: 12.5pt;
      color: #0f172a;
      border-bottom: 1px solid #cbd5e1;
      padding-bottom: 5px;
      margin-top: 16px;
      margin-bottom: 8px;
      page-break-after: avoid;
    }
    h3 {
      font-size: 10.5pt;
      color: #0284c7;
      margin-top: 12px;
      margin-bottom: 6px;
      page-break-after: avoid;
    }
    p, li {
      font-size: 9pt;
      color: #334155;
    }
    blockquote {
      margin: 8px 0;
      padding: 8px 14px;
      background: #f0f9ff;
      border-left: 4px solid #0284c7;
      color: #0369a1;
      font-size: 8.8pt;
      border-radius: 0 6px 6px 0;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 10px 0;
      font-size: 8.2pt;
      page-break-inside: avoid;
    }
    th, td {
      border: 1px solid #cbd5e1;
      padding: 5px 7px;
      text-align: left;
      vertical-align: top;
    }
    th {
      background: #f8fafc;
      color: #0f172a;
      font-weight: 700;
    }
    pre {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 8px;
      font-family: "Fira Code", Menlo, Monaco, Consolas, monospace;
      font-size: 8pt;
      line-height: 1.4;
      overflow-x: auto;
      margin: 8px 0;
      page-break-inside: avoid;
    }
    code {
      font-family: "Fira Code", Menlo, Monaco, Consolas, monospace;
      font-size: 8.2pt;
      background: #f1f5f9;
      padding: 1.5px 3.5px;
      border-radius: 3px;
      color: #0284c7;
    }
    .diagram-box {
      background: #0f172a;
      color: #f8fafc;
      border-radius: 8px;
      padding: 12px;
      margin: 10px 0;
      font-family: "Fira Code", monospace;
      font-size: 8pt;
      line-height: 1.35;
      page-break-inside: avoid;
    }
  </style>
</head>
<body>
  {body_content}
</body>
</html>
