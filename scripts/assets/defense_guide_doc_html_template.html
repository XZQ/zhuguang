<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>2026 GOAI 复赛答辩速查手册 · 逐光队</title>
  <style>
    @page {
      size: A4;
      margin: 18mm 16mm 18mm 16mm;
      @bottom-right {
        content: counter(page);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 9pt;
        color: #64748b;
      }
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: #0f172a;
      line-height: 1.6;
      font-size: 10pt;
      margin: 0;
      padding: 24px;
      background: #ffffff;
    }
    h1 {
      font-size: 18pt;
      color: #0369a1;
      border-bottom: 2px solid #0284c7;
      padding-bottom: 8px;
      margin-top: 0;
      margin-bottom: 12px;
    }
    h2 {
      font-size: 13pt;
      color: #0f172a;
      border-bottom: 1px solid #cbd5e1;
      padding-bottom: 6px;
      margin-top: 18px;
      margin-bottom: 10px;
      page-break-after: avoid;
    }
    h3 {
      font-size: 11pt;
      color: #0284c7;
      margin-top: 14px;
      margin-bottom: 6px;
      page-break-after: avoid;
    }
    p, li {
      font-size: 9.5pt;
      color: #334155;
    }
    blockquote {
      margin: 8px 0;
      padding: 8px 14px;
      background: #f0f9ff;
      border-left: 4px solid #0284c7;
      color: #0369a1;
      font-size: 9pt;
      border-radius: 0 6px 6px 0;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 10px 0;
      font-size: 8.8pt;
      page-break-inside: avoid;
    }
    th, td {
      border: 1px solid #cbd5e1;
      padding: 6px 8px;
      text-align: left;
      vertical-align: top;
    }
    th {
      background: #f8fafc;
      color: #0f172a;
      font-weight: 700;
    }
    code {
      font-family: "Fira Code", Menlo, Monaco, Consolas, monospace;
      font-size: 8.5pt;
      background: #f1f5f9;
      padding: 2px 4px;
      border-radius: 4px;
      color: #0284c7;
    }
    .highlight-red {
      color: #b91c1c;
      font-weight: bold;
    }
    .badge {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 8pt;
      font-weight: 700;
      background: #e0f2fe;
      color: #0369a1;
    }
    .page-break {
      page-break-before: always;
    }
  </style>
</head>
<body>
  {body_content}
</body>
</html>
