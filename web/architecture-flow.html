<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>店巡 Agent · 多 Agent 闭环架构动态流向 (交互动画)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #070d18;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 12px;
    }
    .svg-container {
      width: 100%;
      max-width: 1100px;
      height: auto;
      max-height: 90vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    svg {
      width: 100%;
      height: 100%;
      max-height: 85vh;
      filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.5));
    }
    .flow-legend {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 12px;
      color: #94a3b8;
      margin-top: 10px;
      flex-wrap: wrap;
      justify-content: center;
      font-family: "JetBrains Mono", monospace;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <div class="svg-container">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" width="100%" height="100%">
      <defs>
        <style>
          @keyframes dashMove {
            from { stroke-dashoffset: 24; }
            to { stroke-dashoffset: 0; }
          }
          @keyframes redlineDash {
            from { stroke-dashoffset: 24; }
            to { stroke-dashoffset: 0; }
          }
          @keyframes redlineGlow {
            0%, 100% { stroke: #ef4444; filter: drop-shadow(0 0 3px #ef4444); }
            50% { stroke: #f87171; filter: drop-shadow(0 0 10px #ef4444); }
          }
          @keyframes nodeGlow {
            0%, 100% { filter: drop-shadow(0 0 4px rgba(56, 189, 248, 0.3)); }
            50% { filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.7)); }
          }
          .bg-rect { fill: #070d18; }
          .flow-cyan {
            stroke: #38bdf8;
            stroke-width: 1.8;
            stroke-dasharray: 6, 6;
            animation: dashMove 1.2s linear infinite;
            opacity: 0.85;
          }
          .flow-amber {
            stroke: #f59e0b;
            stroke-width: 1.8;
            stroke-dasharray: 5, 5;
            animation: dashMove 1.2s linear infinite;
            opacity: 0.85;
          }
          .flow-redline {
            stroke-width: 2.2;
            stroke-dasharray: 6, 4;
            animation: redlineDash 1s linear infinite, redlineGlow 2s ease-in-out infinite;
          }
          .card-orch {
            animation: nodeGlow 3s ease-in-out infinite;
          }
          .card-core {
            animation: nodeGlow 2.5s ease-in-out infinite;
          }
          text {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", Helvetica, Arial, sans-serif;
          }
          .mono {
            font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
          }
        </style>

        <!-- Gradients -->
        <linearGradient id="g-orch" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#1e293b"/>
          <stop offset="100%" stop-color="#0f172a"/>
        </linearGradient>
        <linearGradient id="g-core" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#0284c7"/>
          <stop offset="100%" stop-color="#034d75"/>
        </linearGradient>
        <linearGradient id="g-guard" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#78350f"/>
          <stop offset="100%" stop-color="#451a03"/>
        </linearGradient>
        <linearGradient id="g-worker" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#1e293b"/>
          <stop offset="100%" stop-color="#0f172a"/>
        </linearGradient>

        <!-- Arrow Markers -->
        <marker id="m-cyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
        </marker>
        <marker id="m-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 0 1 L 9 5 L 0 9 z" fill="#f59e0b"/>
        </marker>
        <marker id="m-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 0 1 L 9 5 L 0 9 z" fill="#ef4444"/>
        </marker>
      </defs>

      <!-- Background Canvas -->
      <rect width="940" height="480" rx="16" class="bg-rect" stroke="#1e293b" stroke-width="1.5"/>

      <!-- Background Grid Dots -->
      <g opacity="0.1" fill="#38bdf8">
        <circle cx="60" cy="60" r="1.5"/><circle cx="140" cy="60" r="1.5"/><circle cx="220" cy="60" r="1.5"/><circle cx="300" cy="60" r="1.5"/>
        <circle cx="380" cy="60" r="1.5"/><circle cx="460" cy="60" r="1.5"/><circle cx="540" cy="60" r="1.5"/><circle cx="620" cy="60" r="1.5"/>
        <circle cx="700" cy="60" r="1.5"/><circle cx="780" cy="60" r="1.5"/><circle cx="860" cy="60" r="1.5"/>
        <circle cx="60" cy="420" r="1.5"/><circle cx="140" cy="420" r="1.5"/><circle cx="220" cy="420" r="1.5"/><circle cx="300" cy="420" r="1.5"/>
        <circle cx="780" cy="420" r="1.5"/><circle cx="860" cy="420" r="1.5"/>
      </g>

      <!-- Title & Subtitle Badge -->
      <g transform="translate(24, 28)">
        <rect x="0" y="0" width="56" height="20" rx="4" fill="#0284c7" opacity="0.9"/>
        <text x="28" y="14" fill="#ffffff" font-size="10.5" font-weight="800" text-anchor="middle">逐光队</text>
        <text x="66" y="15" fill="#f1f5f9" font-size="14.5" font-weight="700">店巡 Agent · 多 Agent 闭环架构动态流向</text>
        <text x="450" y="14" fill="#64748b" font-size="11">AgentTeams v1.2.3 · 5 Workers 职责分离 · 双重状态安全闭环</text>
      </g>

      <!-- ================= CONNECTION PATHS ================= -->
      <g id="paths">
        <!-- Input -> Orchestrator -->
        <path id="p-in-orch" d="M 120 230 L 190 230" fill="none" class="flow-cyan" marker-end="url(#m-cyan)"/>

        <!-- Orchestrator -> 4 Workers -->
        <path id="p-orch-sen" d="M 310 210 C 340 210, 350 90, 400 90" fill="none" class="flow-cyan" marker-end="url(#m-cyan)"/>
        <path id="p-orch-dia" d="M 310 220 C 345 220, 350 180, 400 180" fill="none" class="flow-cyan" marker-end="url(#m-cyan)"/>
        <path id="p-orch-exe" d="M 310 240 C 345 240, 350 280, 400 280" fill="none" class="flow-cyan" marker-end="url(#m-cyan)"/>
        <path id="p-orch-aud" d="M 310 250 C 340 250, 350 370, 400 370" fill="none" class="flow-cyan" marker-end="url(#m-cyan)"/>

        <!-- 4 Workers -> IncidentService (Core) -->
        <path id="p-sen-core" d="M 540 90 C 590 90, 600 210, 640 210" fill="none" class="flow-cyan" marker-end="url(#m-cyan)"/>
        <path id="p-dia-core" d="M 540 180 C 585 180, 595 220, 640 225" fill="none" class="flow-cyan" marker-end="url(#m-cyan)"/>
        <path id="p-exe-core" d="M 540 280 C 585 280, 595 240, 640 235" fill="none" class="flow-cyan" marker-end="url(#m-cyan)"/>
        <path id="p-aud-core" d="M 540 370 C 590 370, 600 250, 640 250" fill="none" class="flow-cyan" marker-end="url(#m-cyan)"/>

        <!-- Core <--> MCP -->
        <path id="p-core-mcp" d="M 770 220 L 810 220" fill="none" class="flow-cyan" marker-end="url(#m-cyan)"/>
        <path id="p-mcp-core" d="M 810 240 L 770 240" fill="none" class="flow-cyan" marker-end="url(#m-cyan)"/>

        <!-- Guard (Policy/Approval) -.约束.-> Executor -->
        <path id="p-guard-exe" d="M 470 430 L 470 315" fill="none" class="flow-amber" marker-end="url(#m-amber)"/>

        <!-- Auditor -.未通过阻断关闭或回开.-> Core (REDLINE) -->
        <path id="p-aud-block" d="M 470 395 C 470 435, 700 435, 705 270" fill="none" class="flow-redline" marker-end="url(#m-red)"/>
      </g>

      <!-- ================= ANIMATED FLYING DATA PACKETS ================= -->
      <g id="particles">
        <!-- Input to Orchestrator -->
        <circle r="3.5" fill="#38bdf8">
          <animateMotion dur="2.2s" repeatCount="indefinite" path="M 120 230 L 190 230" />
        </circle>

        <!-- Orchestrator to Sentry -->
        <circle r="3.5" fill="#38bdf8">
          <animateMotion dur="2.8s" repeatCount="indefinite" path="M 310 210 C 340 210, 350 90, 400 90" />
        </circle>
        <!-- Orchestrator to Diagnoser -->
        <circle r="3.5" fill="#38bdf8">
          <animateMotion dur="2.8s" begin="0.7s" repeatCount="indefinite" path="M 310 220 C 345 220, 350 180, 400 180" />
        </circle>
        <!-- Orchestrator to Executor -->
        <circle r="3.5" fill="#38bdf8">
          <animateMotion dur="2.8s" begin="1.4s" repeatCount="indefinite" path="M 310 240 C 345 240, 350 280, 400 280" />
        </circle>
        <!-- Orchestrator to Auditor -->
        <circle r="3.5" fill="#38bdf8">
          <animateMotion dur="2.8s" begin="2.1s" repeatCount="indefinite" path="M 310 250 C 340 250, 350 370, 400 370" />
        </circle>

        <!-- Workers to Core -->
        <circle r="3.5" fill="#38bdf8">
          <animateMotion dur="2.6s" begin="0.3s" repeatCount="indefinite" path="M 540 90 C 590 90, 600 210, 640 210" />
        </circle>
        <circle r="3.5" fill="#38bdf8">
          <animateMotion dur="2.6s" begin="1.1s" repeatCount="indefinite" path="M 540 180 C 585 180, 595 220, 640 225" />
        </circle>
        <circle r="3.5" fill="#38bdf8">
          <animateMotion dur="2.6s" begin="1.8s" repeatCount="indefinite" path="M 540 280 C 585 280, 595 240, 640 235" />
        </circle>
        <circle r="3.5" fill="#38bdf8">
          <animateMotion dur="2.6s" begin="2.4s" repeatCount="indefinite" path="M 540 370 C 590 370, 600 250, 640 250" />
        </circle>

        <!-- Core <--> MCP -->
        <circle r="3.5" fill="#38bdf8">
          <animateMotion dur="2.0s" repeatCount="indefinite" path="M 770 220 L 810 220" />
        </circle>
        <circle r="3.5" fill="#7dd3fc">
          <animateMotion dur="2.0s" begin="1.0s" repeatCount="indefinite" path="M 810 240 L 770 240" />
        </circle>

        <!-- Guard to Executor -->
        <circle r="3.5" fill="#f59e0b">
          <animateMotion dur="2.4s" repeatCount="indefinite" path="M 470 430 L 470 315" />
        </circle>

        <!-- Auditor Redline Blocker Pulse -->
        <circle r="4" fill="#ef4444">
          <animateMotion dur="2.5s" repeatCount="indefinite" path="M 470 395 C 470 435, 700 435, 705 270" />
        </circle>
      </g>

      <!-- ================= ANNOTATIONS ================= -->
      <!-- Redline Banner -->
      <g transform="translate(540, 440)">
        <rect x="-10" y="-12" width="220" height="24" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1.2"/>
        <text x="100" y="4.5" fill="#fca5a5" font-size="11" font-weight="700" text-anchor="middle">
          ⚠ 未通过则阻断关闭或回开 (核心红线)
        </text>
      </g>

      <!-- Guard Label -->
      <g transform="translate(395, 325)">
        <text x="75" y="24" fill="#fcd34d" font-size="10.5" font-weight="600" text-anchor="middle">
          审批/Policy 策略强门禁
        </text>
      </g>

      <!-- ================= NODES ================= -->

      <!-- 1. External Events Ingest -->
      <g id="node-input" transform="translate(24, 195)">
        <rect width="96" height="70" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
        <text x="48" y="28" fill="#94a3b8" font-size="11" font-weight="600" text-anchor="middle">外部事件源</text>
        <text x="48" y="46" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">IoT/告警/工单</text>
        <text x="48" y="60" fill="#64748b" font-size="9" text-anchor="middle">MQTT / REST</text>
      </g>

      <!-- 2. Orchestrator (Leader) -->
      <g id="node-orch" class="card-orch" transform="translate(190, 180)">
        <rect width="120" height="100" rx="12" fill="url(#g-orch)" stroke="#0284c7" stroke-width="1.8"/>
        <rect x="8" y="8" width="104" height="20" rx="4" fill="#0369a1" opacity="0.4"/>
        <text x="60" y="22" fill="#38bdf8" font-size="10.5" font-weight="800" text-anchor="middle">TEAM LEADER</text>
        <text x="60" y="52" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle">Orchestrator</text>
        <text x="60" y="70" fill="#94a3b8" font-size="10.5" text-anchor="middle">协调阶段 / 任务拆解</text>
        <text x="60" y="85" fill="#64748b" font-size="9.5" text-anchor="middle">端口 19408 (qwenpaw)</text>
      </g>

      <!-- 3. Four Workers (Middle Column) -->
      <!-- Worker: Sentry -->
      <g id="node-sen" transform="translate(400, 60)">
        <rect width="140" height="60" rx="8" fill="url(#g-worker)" stroke="#38bdf8" stroke-width="1.2"/>
        <circle cx="16" cy="20" r="5" fill="#38bdf8"/>
        <text x="28" y="24" fill="#f8fafc" font-size="13" font-weight="700">Sentry</text>
        <text x="124" y="22" fill="#38bdf8" font-size="9.5" font-weight="600" text-anchor="end">10419</text>
        <text x="16" y="44" fill="#94a3b8" font-size="10.5">巡检守卫 / 失温检测</text>
      </g>

      <!-- Worker: Diagnoser -->
      <g id="node-dia" transform="translate(400, 150)">
        <rect width="140" height="60" rx="8" fill="url(#g-worker)" stroke="#818cf8" stroke-width="1.2"/>
        <circle cx="16" cy="20" r="5" fill="#818cf8"/>
        <text x="28" y="24" fill="#f8fafc" font-size="13" font-weight="700">Diagnoser</text>
        <text x="124" y="22" fill="#818cf8" font-size="9.5" font-weight="600" text-anchor="end">12693</text>
        <text x="16" y="44" fill="#94a3b8" font-size="10.5">根因推断 / 批次定损</text>
      </g>

      <!-- Worker: Executor -->
      <g id="node-exe" transform="translate(400, 250)">
        <rect width="140" height="60" rx="8" fill="url(#g-worker)" stroke="#f59e0b" stroke-width="1.2"/>
        <circle cx="16" cy="20" r="5" fill="#f59e0b"/>
        <text x="28" y="24" fill="#f8fafc" font-size="13" font-weight="700">Executor</text>
        <text x="124" y="22" fill="#f59e0b" font-size="9.5" font-weight="600" text-anchor="end">17666</text>
        <text x="16" y="44" fill="#94a3b8" font-size="10.5">受控执行 / 派单处置</text>
      </g>

      <!-- Worker: Auditor -->
      <g id="node-aud" transform="translate(400, 340)">
        <rect width="140" height="60" rx="8" fill="url(#g-worker)" stroke="#10b981" stroke-width="1.6"/>
        <circle cx="16" cy="20" r="5" fill="#10b981"/>
        <text x="28" y="24" fill="#f8fafc" font-size="13" font-weight="700">Auditor</text>
        <text x="124" y="22" fill="#10b981" font-size="9.5" font-weight="600" text-anchor="end">18780</text>
        <text x="16" y="44" fill="#34d399" font-size="10.5" font-weight="600">独立验真 / 一票否决</text>
      </g>

      <!-- Policy Guard Box (Below Executor) -->
      <g id="node-guard" transform="translate(400, 420)">
        <rect width="140" height="34" rx="6" fill="url(#g-guard)" stroke="#f59e0b" stroke-width="1"/>
        <text x="70" y="21" fill="#fef3c7" font-size="11" font-weight="700" text-anchor="middle">🛡 Policy 策略审批守卫</text>
      </g>

      <!-- 4. IncidentService (Core Domain) -->
      <g id="node-core" class="card-core" transform="translate(640, 180)">
        <rect width="130" height="100" rx="12" fill="url(#g-core)" stroke="#38bdf8" stroke-width="2"/>
        <rect x="8" y="8" width="114" height="20" rx="4" fill="#0284c7" opacity="0.6"/>
        <text x="65" y="22" fill="#e0f2fe" font-size="10.5" font-weight="800" text-anchor="middle">DOMAIN CORE</text>
        <text x="65" y="50" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle">IncidentService</text>
        <text x="65" y="68" fill="#e2e8f0" font-size="10.5" text-anchor="middle">状态机 / 事务持久化</text>
        <text x="65" y="85" fill="#bae6fd" font-size="9.5" text-anchor="middle">CAS 乐观锁 / 审计流</text>
      </g>

      <!-- 5. MCP / External Services (Right Column) -->
      <g id="node-mcp" transform="translate(810, 195)">
        <rect width="105" height="70" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
        <text x="52.5" y="28" fill="#94a3b8" font-size="11" font-weight="600" text-anchor="middle">外部环境适配</text>
        <text x="52.5" y="46" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">MCP Tools</text>
        <text x="52.5" y="60" fill="#64748b" font-size="9" text-anchor="middle">12 + 3 扩展工具</text>
      </g>
    </svg>
  </div>

  <div class="flow-legend">
    <div class="legend-item"><span class="dot" style="background:#38bdf8"></span> 协调与数据流向</div>
    <div class="legend-item"><span class="dot" style="background:#f59e0b"></span> 策略审批刚性门禁 (Policy Guard)</div>
    <div class="legend-item"><span class="dot" style="background:#ef4444"></span> 核心红线：Auditor 独立预言机一票否决</div>
    <div class="legend-item"><span class="dot" style="background:#10b981"></span> 双确认路径安全闭环</div>
  </div>
</body>
</html>
