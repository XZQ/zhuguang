name: 功能建议
description: 提议可验证、可复用的改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述使用者、场景、当前缺口和完成条件。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明接口、兼容性、风险和可复现验证方式。
    validations:
      required: true
  - type: dropdown
    id: evidence
    attributes:
      label: 需要的证据环境
      options:
        - 仓库内确定性环境
        - AgentTeams 目标运行时
        - PolarDB/OSS 目标环境
        - 真实门店或企业系统
    validations:
      required: true
