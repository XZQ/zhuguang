name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.suite == 'tests' && 'verify' || 'artifacts' }} (${{ matrix.os }}, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
            suite: tests
          - os: windows-latest
            python: "3.12"
            suite: tests
          - os: ubuntu-latest
            python: "3.11"
            suite: artifacts
          - os: windows-latest
            python: "3.12"
            suite: artifacts
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      UV_PYTHON: ${{ matrix.python }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install ${{ matrix.python }}

      - name: Install Node for portal regressions
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Sync locked dependencies
        run: uv sync --locked --group dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Unit and conditional integration tests
        if: matrix.suite == 'tests'
        run: uv run python -W error::ResourceWarning -m unittest discover -v

      - name: Test inventory and documented evidence agree
        run: uv run python scripts/check_quality_facts.py

      - name: M4 evaluation
        if: matrix.suite == 'artifacts'
        run: uv run dianxun evaluate

      - name: Architecture ablation
        if: matrix.suite == 'artifacts'
        run: uv run dianxun ablation

      - name: Command center
        if: matrix.suite == 'artifacts'
        run: uv run dianxun command-center

      - name: Deterministic seed
        if: matrix.suite == 'artifacts'
        run: uv run python scripts/generate_demo_data.py --check

      - name: Coordination recovery drill
        if: matrix.suite == 'artifacts'
        run: uv run python scripts/recovery_drill.py --check

      - name: Deterministic Worker package
        if: matrix.suite == 'artifacts'
        run: uv run python scripts/build_worker_package.py

      - name: Worker artifact contract
        if: matrix.suite == 'artifacts'
        run: uv run python -m unittest -v tests.test_agentteams_artifacts

      - name: Build wheel and source distribution
        if: matrix.suite == 'artifacts'
        run: uv build

      - name: Installed wheel outside the checkout with Docker COPY inputs
        if: matrix.suite == 'artifacts'
        run: uv run python scripts/check_installed_distribution.py --docker-inputs

      - name: Rebuild presentation sources and full portal
        if: matrix.suite == 'artifacts'
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/build_animated_svg.py
          uv run python scripts/build_full_delivery_portal.py

      - name: Generated artifacts are current
        run: git diff --exit-code

  postgres-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Start isolated PostgreSQL with pgvector
        run: |
          docker run -d --name zhuguang-archive-ci --network none --memory 512m --cpus 1 \
            -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=zhuguang_archive_test \
            pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
          for attempt in $(seq 1 30); do
            if docker exec zhuguang-archive-ci pg_isready -U postgres -d zhuguang_archive_test; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Fresh bootstrap and real foreign-table archive regressions
        shell: bash
        run: |
          set -euo pipefail
          cat src/dianxun/state/sql/postgres_schema.sql \
              src/dianxun/state/sql/postgres_security.sql \
              src/dianxun/state/sql/postgres_archive.sql \
              tests/sql/archive_regression.sql |
            docker exec -i zhuguang-archive-ci psql -X -v ON_ERROR_STOP=1 \
              -U postgres -d zhuguang_archive_test

      - name: Build PostgreSQL integration runner
        run: docker build -f packages/dianxun-mcp/Dockerfile -t dianxun-pg-tests:ci .

      - name: Separate runtime login, scope isolation and append-only audit upgrade
        shell: bash
        run: |
          set -euo pipefail
          docker exec zhuguang-archive-ci createdb -U postgres zhuguang_runtime_test
          cat src/dianxun/state/sql/postgres_schema.sql src/dianxun/state/sql/postgres_security.sql |
            docker exec -i zhuguang-archive-ci psql -X -v ON_ERROR_STOP=1 \
              -U postgres -d zhuguang_runtime_test
          # Simulate the old privilege: upgrade must revoke it, not only omit a new GRANT.
          docker exec zhuguang-archive-ci psql -X -v ON_ERROR_STOP=1 \
            -U postgres -d zhuguang_runtime_test -c 'GRANT UPDATE ON audit_log TO dianxun_runtime;'
          cat src/dianxun/state/sql/postgres_security.sql tests/sql/runtime_security_regression.sql |
            docker exec -i zhuguang-archive-ci psql -X -v ON_ERROR_STOP=1 \
              -U postgres -d zhuguang_runtime_test

      - name: Create separate integration database and readonly login
        run: |
          docker exec zhuguang-archive-ci createdb -U postgres zhuguang_integration_test
          docker exec zhuguang-archive-ci psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres \
            -c 'CREATE ROLE zhuguang_test_ro LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION; GRANT dianxun_business_ro TO zhuguang_test_ro;'

      - name: Real PostgreSQL scenarios, recovery, vector, snapshot and RLS without skips
        run: |
          docker run --rm --network container:zhuguang-archive-ci --memory 512m --cpus 1 \
            --entrypoint python -v "$GITHUB_WORKSPACE:/workspace:ro" -w /workspace \
            -e PYTHONPATH=/workspace/src \
            -e DIANXUN_TEST_POSTGRES_DSN=postgresql://postgres@127.0.0.1/zhuguang_integration_test \
            -e DIANXUN_TEST_POSTGRES_READONLY_DSN=postgresql://zhuguang_test_ro@127.0.0.1/zhuguang_integration_test \
            -e DIANXUN_TEST_POSTGRES_RUNTIME_DSN=postgresql://zhuguang_test_runtime@127.0.0.1/zhuguang_integration_test \
            -e DIANXUN_ALLOW_TEST_DATABASE_RESET=1 dianxun-pg-tests:ci -W error::ResourceWarning \
            -c 'import sys, unittest; suite = unittest.defaultTestLoader.loadTestsFromName("tests.test_polardb_integration"); result = unittest.TextTestRunner(verbosity=2).run(suite); sys.exit(not result.wasSuccessful() or bool(result.skipped) or result.testsRun == 0)'

      - name: Build matching PostgreSQL backup test tools
        run: docker build -f tests/Dockerfile.postgres -t dianxun-pg-capture:ci .

      - name: Create empty capture and restore databases
        run: |
          docker exec zhuguang-archive-ci createdb -U postgres zhuguang_capture_test
          docker exec zhuguang-archive-ci createdb -U postgres zhuguang_restore_test

      - name: Real pg_dump, separate pg_restore, incident comparison and offline replay
        run: |
          docker run --rm --network container:zhuguang-archive-ci --memory 512m --cpus 1 \
            -v "$GITHUB_WORKSPACE:/workspace:ro" -e PYTHONPATH=/workspace/src \
            -e DIANXUN_BUILD_SHA="$GITHUB_SHA" \
            -e DIANXUN_TEST_POSTGRES_DSN=postgresql://postgres@127.0.0.1/zhuguang_capture_test \
            -e DIANXUN_TEST_POSTGRES_RESTORE_DSN=postgresql://postgres@127.0.0.1/zhuguang_restore_test \
            -e DIANXUN_ALLOW_TEST_DATABASE_RESET=1 dianxun-pg-capture:ci \
            scripts/check_postgres_capture.py --output /var/lib/dianxun/capture

      - name: Stop isolated PostgreSQL
        if: always()
        run: docker stop zhuguang-archive-ci

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Build actual runtime image
        run: docker build -f packages/dianxun-mcp/Dockerfile -t dianxun-mcp:ci .

      - name: Non-root container, readiness, authenticated MCP and Worker runtime
        run: python3 scripts/check_docker_image.py --image dianxun-mcp:ci
